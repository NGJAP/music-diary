<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>音乐手账</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --surface-2: #222;
      --border: #2a2a2a;
      --text: #f5f5f5;
      --text-2: #999;
      --accent: #ff6b6b;
      --star: #555;
      --star-filled: #ffd700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 100px;
      -webkit-overflow-scrolling: touch;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 10px; }
    button, .file-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover, .file-btn:hover { background: var(--surface-2); border-color: #444; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"], input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus, input[type="number"]:focus { border-color: #555; }
    
    .section-title {
      font-size: 14px;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 20px 0 12px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.15s;
      cursor: pointer;
    }
    .card:active { transform: scale(0.98); }
    .card-cover {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #222;
      display: block;
    }
    .card-body { padding: 12px; }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-artist {
      font-size: 12px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .card-year {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
    .album-score {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--star-filled);
    }
    .album-score::after {
      content: '/10';
      font-size: 12px;
      color: var(--text-2);
      margin-left: 2px;
      font-weight: 400;
    }
    .note {
      font-size: 12px;
      color: #bbb;
      margin-top: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty {
      text-align: center;
      color: var(--text-2);
      padding: 60px 20px;
      font-size: 14px;
    }
    
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(16, 16, 16, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 0;
      color: var(--text-2);
      cursor: pointer;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-item.active {
      color: var(--text);
    }
    .tab-icon {
      font-size: 22px;
      line-height: 1;
    }
    .tab-label {
      font-size: 11px;
    }
    
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }
    .modal-cover {
      width: 110px;
      height: 110px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }
    .modal-title { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .modal-artist { font-size: 14px; color: var(--text-2); margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 8px;
    }
    .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
    }
    .score-input {
      width: 100px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
    }
    .tracks-section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
    }
    .tracks-section h4 {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 12px;
    }
    .track-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      min-height: 44px;
    }
    .track-item:last-child { border-bottom: none; }
    .track-number {
      width: 26px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }
    .track-name {
      flex: 1;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-stars {
      font-size: 18px;
      cursor: pointer;
      letter-spacing: 2px;
      white-space: nowrap;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .star {
      color: var(--star);
      opacity: 0.6;
      transition: all 0.12s;
      display: inline-block;
      padding: 0 1px;
    }
    .star.filled {
      color: var(--star-filled);
      opacity: 1;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.35);
    }
    .track-stars .star:active {
      transform: scale(1.5);
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }
    .modal-actions button { flex: 1; padding: 14px; font-size: 15px; }
    .btn-primary { background: var(--text); color: var(--bg); font-weight: 600; }
    .btn-primary:hover { background: #ddd; }
    .loading { text-align: center; color: var(--text-2); padding: 40px; }
    
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface-2);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 200;
      border: 1px solid var(--border);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="main-content">
      <div class="container">
        <header>
          <h1>音乐手账</h1>
          <div class="header-actions">
            <button onclick="exportData()">导出</button>
            <label class="file-btn">
              导入
              <input type="file" accept=".json" hidden onchange="importData(this)">
            </label>
          </div>
        </header>

        <div class="tab-panel active" id="panel-records">
          <div id="myRecords" class="grid">
            <div class="empty">还没有记录，去搜索一张专辑吧</div>
          </div>
        </div>

        <div class="tab-panel" id="panel-search">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索专辑、艺人..." onkeypress="if(event.key==='Enter') searchAlbums()">
            <button id="searchBtn" onclick="searchAlbums()">搜索</button>
          </div>
          <div id="searchResults" class="grid">
            <div class="empty">搜索专辑后结果会显示在这里</div>
          </div>
        </div>
      </div>
    </div>

    <nav class="tab-bar">
      <div class="tab-item active" onclick="switchTab('records')" data-tab="records">
        <span class="tab-icon">📀</span>
        <span class="tab-label">我的记录</span>
      </div>
      <div class="tab-item" onclick="switchTab('search')" data-tab="search">
        <span class="tab-icon">🔍</span>
        <span class="tab-label">搜索</span>
      </div>
    </nav>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <img id="modalCover" class="modal-cover" src="" alt="">
        <div>
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-artist" id="modalArtist"></div>
        </div>
      </div>
      
      <div class="form-group">
        <label>专辑评分（0 - 10 分）</label>
        <input type="number" id="modalScore" class="score-input" min="0" max="10" step="0.1" placeholder="0-10">
      </div>
      
      <div class="form-group">
        <label>感受</label>
        <textarea id="modalNote" placeholder="写下你听完这张专辑的感受..."></textarea>
      </div>
      
      <div class="tracks-section" id="tracksSection">
        <h4>单曲评分</h4>
        <div id="tracksList"></div>
      </div>
      
      <div class="modal-actions">
        <button onclick="closeModal()">取消</button>
        <button class="btn-primary" onclick="saveModal()">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const DB_NAME = 'MusicDiary';
    const STORE_NAME = 'records';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(req.result);
        req.onupgradeneeded = (e) => {
          e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
        };
      });
    }

    async function saveRecord(record) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(record);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getRecords() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function deleteRecord(id) {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = resolve;
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.getElementById(`panel-${tab}`).classList.add('active');
      document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
      if (tab === 'records') renderRecords();
    }

    async function searchAlbums() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      
      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      btn.textContent = '搜索中...';
      
      const container = document.getElementById('searchResults');
      container.innerHTML = '<div class="empty">正在搜索...</div>';
      
      try {
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=album&limit=20&country=us`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderSearchResults(data.results);
      } catch (err) {
        container.innerHTML = '<div class="empty">搜索失败，请检查网络或 VPN 后重试</div>';
        showToast('搜索失败：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '搜索';
      }
    }

    function renderSearchResults(albums) {
      const container = document.getElementById('searchResults');
      if (!albums || albums.length === 0) {
        container.innerHTML = '<div class="empty">没找到相关专辑</div>';
        return;
      }
      container.innerHTML = albums.map(a => {
        const cover = (a.artworkUrl100 || '').replace('100x100bb', '300x300bb') || 'https://via.placeholder.com/300?text=No+Cover';
        const year = a.releaseDate ? a.releaseDate.slice(0, 4) : '';
        return `
          <div class="card search-card"
               data-id="${a.collectionId}"
               data-title="${escapeHtml(a.collectionName || '')}"
               data-artist="${escapeHtml(a.artistName || '')}"
               data-cover="${cover}">
            <img class="card-cover" src="${cover}" alt="" loading="lazy">
            <div class="card-body">
              <div class="card-title">${escapeHtml(a.collectionName || '')}</div>
              <div class="card-artist">${escapeHtml(a.artistName || '')}</div>
              <div class="card-year">${year}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchResults').addEventListener('click', async (e) => {
      const card = e.target.closest('.search-card');
      if (!card) return;
      
      const id = card.dataset.id;
      const records = await getRecords();
      const existing = records.find(r => r.id === id);
      
      if (existing) {
        showToast('这张专辑已经记录过了');
        openEdit(id);
        return;
      }
      
      openAdd(card.dataset);
    });

    let modalState = { mode: null, id: null, tracks: [] };

    async function openAdd(data) {
      modalState = { mode: 'add', id: data.id, tracks: [] };
      
      document.getElementById('modalCover').src = data.cover;
      document.getElementById('modalTitle').textContent = data.title;
      document.getElementById('modalArtist').textContent = data.artist;
      document.getElementById('modalScore').value = '';
      document.getElementById('modalNote').value = '';
      document.getElementById('tracksList').innerHTML = '<div class="loading">正在加载曲目...</div>';
      document.getElementById('editModal').classList.add('show');
      
      try {
        const tracks = await fetchTracks(data.id);
        modalState.tracks = tracks;
        renderTracks();
      } catch (err) {
        document.getElementById('tracksList').innerHTML = '<div class="loading">加载曲目失败</div>';
      }
    }

    async function openEdit(id) {
      const records = await getRecords();
      const r = records.find(x => x.id === id);
      if (!r) return;
      
      modalState = { mode: 'edit', id, tracks: r.tracks || [] };
      
      document.getElementById('modalCover').src = r.cover;
      document.getElementById('modalTitle').textContent = r.title;
      document.getElementById('modalArtist').textContent = r.artist;
      document.getElementById('modalScore').value = r.rating || '';
      document.getElementById('modalNote').value = r.note || '';
      
      if (!r.tracks || r.tracks.length === 0) {
        document.getElementById('tracksList').innerHTML = '<div class="loading">正在加载曲目...</div>';
        try {
          const tracks = await fetchTracks(id);
          modalState.tracks = tracks;
          renderTracks();
        } catch (err) {
          document.getElementById('tracksList').innerHTML = '<div class="loading">加载曲目失败</div>';
        }
      } else {
        renderTracks();
      }
      
      document.getElementById('editModal').classList.add('show');
    }

    async function fetchTracks(albumId) {
      const url = `https://itunes.apple.com/lookup?id=${albumId}&entity=song&country=us`;
      const res = await fetch(url);
      const data = await res.json();
      return (data.results || [])
        .filter(x => x.wrapperType === 'track' || x.kind === 'song')
        .sort((a, b) => (a.trackNumber || 0) - (b.trackNumber || 0))
        .map(t => ({
          id: String(t.trackId || t.trackCensoredName),
          name: t.trackName || t.trackCensoredName || 'Unknown Track',
          number: t.trackNumber || 0,
          rating: 0
        }));
    }

    function renderTracks() {
      const container = document.getElementById('tracksList');
      if (modalState.tracks.length === 0) {
        container.innerHTML = '<div class="loading">暂无曲目信息</div>';
        return;
      }
      container.innerHTML = modalState.tracks.map((t, idx) => `
        <div class="track-item">
          <div class="track-number">${t.number || idx + 1}</div>
          <div class="track-name" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>
          <div class="track-stars" data-idx="${idx}" role="button" aria-label="单曲评分">
            ${[1,2,3,4,5].map(n => `<span class="star ${n <= t.rating ? 'filled' : ''}" data-star="${n}">★</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    document.getElementById('tracksList').addEventListener('click', (e) => {
      const star = e.target.closest('.track-stars .star');
      if (!star) return;
      e.stopPropagation();
      e.preventDefault();
      
      const idx = Number(star.closest('.track-stars').dataset.idx);
      const rating = Number(star.dataset.star);
      const trackName = modalState.tracks[idx].name;
      
      modalState.tracks[idx].rating = rating;
      renderTracks();
      showToast(`《${trackName.slice(0, 12)}${trackName.length > 12 ? '...' : ''}》${rating} 星`);
    });

    function closeModal() {
      document.getElementById('editModal').classList.remove('show');
      modalState = { mode: null, id: null, tracks: [] };
    }

    async function saveModal() {
      if (!modalState.id) return;
      
      const scoreInput = document.getElementById('modalScore').value;
      const score = scoreInput === '' ? 0 : Math.max(0, Math.min(10, parseFloat(scoreInput) || 0));
      
      if (modalState.mode === 'add') {
        const records = await getRecords();
        const existing = records.find(r => r.id === modalState.id);
        if (existing) {
          showToast('这张专辑已经记录过了');
          closeModal();
          return;
        }
        
        await saveRecord({
          id: modalState.id,
          title: document.getElementById('modalTitle').textContent,
          artist: document.getElementById('modalArtist').textContent,
          cover: document.getElementById('modalCover').src,
          rating: score,
          note: document.getElementById('modalNote').value.trim(),
          tracks: modalState.tracks,
          date: new Date().toISOString()
        });
        showToast('已添加');
      } else {
        const records = await getRecords();
        const r = records.find(x => x.id === modalState.id);
        if (!r) return;
        r.rating = score;
        r.note = document.getElementById('modalNote').value.trim();
        r.tracks = modalState.tracks;
        await saveRecord(r);
        showToast('已保存');
      }
      
      closeModal();
      renderRecords();
    }

    async function renderRecords() {
      const records = await getRecords();
      const container = document.getElementById('myRecords');
      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      if (records.length === 0) {
        container.innerHTML = '<div class="empty">还没有记录，去搜索一张专辑吧</div>';
        return;
      }
      
      container.innerHTML = records.map(r => `
        <div class="card" onclick="openEdit('${r.id}')">
          <img class="card-cover" src="${r.cover}" alt="" loading="lazy">
          <div class="card-body">
            <div class="card-title">${escapeHtml(r.title)}</div>
            <div class="card-artist">${escapeHtml(r.artist)}</div>
            ${r.rating ? `<div class="album-score">${r.rating}</div>` : ''}
            ${r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function exportData() {
      const records = await getRecords();
      if (records.length === 0) {
        showToast('还没有记录可导出');
        return;
      }
      const data = {
        app: 'music-diary',
        version: 2,
        exportDate: new Date().toISOString(),
        records
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `music-diary-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.createObjectURL(url);
      showToast('已导出');
    }

    async function importData(input) {
      const file = input.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const records = data.records || data;
        if (!Array.isArray(records)) throw new Error('格式错误');
        
        let count = 0;
        for (const r of records) {
          if (r.id && r.title) {
            if (!r.tracks) r.tracks = [];
            await saveRecord(r);
            count++;
          }
        }
        renderRecords();
        showToast(`成功导入 ${count} 条记录`);
      } catch (err) {
        showToast('导入失败：文件格式不对');
      }
      input.value = '';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    renderRecords();
  </script>
</body>
</html>
